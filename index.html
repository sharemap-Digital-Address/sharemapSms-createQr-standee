<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShareMap - Merchant QR Generator</title>
  <!-- QRious Engine (Reliable Direct Canvas Generator) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      padding: 20px; 
      max-width: 420px; 
      margin: auto; 
      background-color: #f4f7f6;
    }
    .card {
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2 { margin-top: 0; text-align: center; color: #333; }
    label { font-weight: bold; display: block; margin-top: 12px; font-size: 14px; }
    input[type="text"], input[type="tel"], input[type="file"] { 
      width: 100%; 
      padding: 10px; 
      margin-top: 5px; 
      box-sizing: border-box; 
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    button { 
      width: 100%; 
      padding: 12px; 
      margin-top: 15px; 
      background: #0275d8; 
      color: white; 
      border: none; 
      font-weight: bold; 
      font-size: 15px;
      border-radius: 6px; 
      cursor: pointer; 
    }
    #downloadBtn {
      background: #28a745;
      display: none;
    }
    .canvas-container {
      margin-top: 20px;
      text-align: center;
    }
    canvas {
      max-width: 100%;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>

<div class="card">
  <h2>📍 ShareMap QR Standee</h2>

  <label for="storeName">Pangalan ng Tokahan / Seller / Rider:</label>
  <input type="text" id="storeName" placeholder="hal. Aling Nena Store / Rider Juan">

  <label for="phone">Cellphone Number Mo:</label>
  <input type="tel" id="phone" placeholder="09123456789">

  <label for="logoInput">Custom Logo / Profile Photo (Optional):</label>
  <input type="file" id="logoInput" accept="image/*">

  <button onclick="generateMerchantQR()">🎨 I-GENERATE ANG MERCHANTS QR</button>
  
  <div class="canvas-container">
    <canvas id="qrCanvas"></canvas>
  </div>

  <button id="downloadBtn" onclick="downloadQR()">📥 DOWNLOAD QR STANDEE (PNG)</button>
</div>

<script>
  let uploadedLogo = null;

  // Read uploaded logo file
  document.getElementById('logoInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          uploadedLogo = img;
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    } else {
      uploadedLogo = null;
    }
  });

  function generateMerchantQR() {
    const storeName = document.getElementById('storeName').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const canvas = document.getElementById('qrCanvas');
    const ctx = canvas.getContext('2d');
    const downloadBtn = document.getElementById('downloadBtn');

    if (!phone) {
      alert("Paki-lagay ang cellphone number mo!");
      return;
    }

    // Target ShareMap URL
    const sharemapUrl = `https://sharemap-digital-address.github.io/send-sharemap-smslocation/?phone=${phone}`;

    // 1. Setup Canvas Card Dimensions
    canvas.width = 340;
    canvas.height = 460;

    // Background Card
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Header Bar
    ctx.fillStyle = "#0275d8";
    ctx.fillRect(0, 0, canvas.width, 60);

    // Header Title
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 18px Arial";
    ctx.textAlign = "center";
    ctx.fillText("📍 SHAREMAP DIGITAL ADDRESS", canvas.width / 2, 38);

    // 2. Render QR Engine directly to memory
    const qrEngine = new QRious({
      value: sharemapUrl,
      size: 240,
      level: 'H' // High Error Correction para readable kahit may Logo
    });

    // Create temporary image element for QR render
    const qrImg = new Image();
    qrImg.onload = function() {
      const qrX = (canvas.width - 240) / 2;
      const qrY = 80;

      // Draw QR Code onto Card
      ctx.drawImage(qrImg, qrX, qrY, 240, 240);

      // 3. Overlay Custom Logo in Center (if provided)
      if (uploadedLogo) {
        const logoSize = 48;
        const logoX = (canvas.width - logoSize) / 2;
        const logoY = qrY + (240 - logoSize) / 2;

        // White background box for logo contrast
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(logoX - 4, logoY - 4, logoSize + 8, logoSize + 8);

        // Draw Custom Logo
        ctx.drawImage(uploadedLogo, logoX, logoY, logoSize, logoSize);
      }

      // Divider Line
      ctx.strokeStyle = "#e0e0e0";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(30, 340);
      ctx.lineTo(canvas.width - 30, 340);
      ctx.stroke();

      // Store / Merchant Name
      ctx.fillStyle = "#222222";
      ctx.font = "bold 18px Arial";
      ctx.fillText(storeName || "SHAREMAP MERCHANT", canvas.width / 2, 375);

      // Phone Sub-text
      ctx.fillStyle = "#555555";
      ctx.font = "14px Arial";
      ctx.fillText(`📱 ${phone}`, canvas.width / 2, 400);

      // Footer Note
      ctx.fillStyle = "#888888";
      ctx.font = "italic 11px Arial";
      ctx.fillText("I-scan para mag-send ng Exact Location via SMS", canvas.width / 2, 435);

      // Show Download Button
      downloadBtn.style.display = "block";
    };

    // Trigger QR Image load
    qrImg.src = qrEngine.toDataURL();
  }

  function downloadQR() {
    const canvas = document.getElementById('qrCanvas');
    const storeName = document.getElementById('storeName').value.trim() || 'ShareMap';
    const link = document.createElement('a');
    
    const fileName = storeName.toLowerCase().replace(/[^a-z0-9]/g, '_');
    link.download = `sharemap_qr_${fileName}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  }
</script>

</body>
</html>
