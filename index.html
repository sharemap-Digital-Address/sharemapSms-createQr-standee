<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShareMap - Merchant QR Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      padding: 15px; 
      max-width: 420px; 
      margin: auto; 
      background-color: #f4f7f6;
    }
    .card {
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2 { margin-top: 0; text-align: center; color: #333; }
    label { font-weight: bold; display: block; margin-top: 12px; font-size: 14px; }
    input[type="text"], input[type="tel"], input[type="file"] { 
      width: 100%; 
      padding: 10px; 
      margin-top: 5px; 
      box-sizing: border-box; 
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    button { 
      width: 100%; 
      padding: 12px; 
      margin-top: 15px; 
      background: #0275d8; 
      color: white; 
      border: none; 
      font-weight: bold; 
      font-size: 15px;
      border-radius: 6px; 
      cursor: pointer; 
    }
    #downloadBtn {
      background: #28a745;
      display: none;
    }
    .canvas-container {
      margin-top: 20px;
      text-align: center;
    }
    canvas {
      width: 100%;
      max-width: 340px; /* Displayed size on screen */
      height: auto;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    #tempQrDiv { display: none; }
  </style>
</head>
<body>

<div class="card">
  <h2>📍 ShareMap QR Standee</h2>

  <label for="storeName">Pangalan ng Tokahan / Seller / Rider:</label>
  <input type="text" id="storeName" placeholder="hal. Aling Nena Store / Rider Juan">

  <label for="phone">Cellphone Number Mo:</label>
  <input type="tel" id="phone" placeholder="09123456789">

  <label for="logoInput">Custom Logo / Profile Photo (Optional):</label>
  <input type="file" id="logoInput" accept="image/*">

  <button onclick="generateMerchantQR()">🎨 I-GENERATE ANG MERCHANTS QR</button>
  
  <div class="canvas-container">
    <canvas id="qrCanvas"></canvas>
  </div>

  <button id="downloadBtn" onclick="downloadQR()">📥 DOWNLOAD HD QR STANDEE (PNG)</button>
</div>

<div id="tempQrDiv"></div>

<script>
  let uploadedLogo = null;

  document.getElementById('logoInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          uploadedLogo = img;
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    } else {
      uploadedLogo = null;
    }
  });

  function generateMerchantQR() {
    const storeName = document.getElementById('storeName').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const tempDiv = document.getElementById('tempQrDiv');

    if (!phone) {
      alert("Paki-lagay ang cellphone number mo!");
      return;
    }

    tempDiv.innerHTML = "";

    const sharemapUrl = `https://sharemap-digital-address.github.io/send-sharemap-smslocation/?phone=${phone}`;

    // Generate high-res base QR (720x720)
    new QRCode(tempDiv, {
      text: sharemapUrl,
      width: 720,
      height: 720,
      correctLevel: QRCode.CorrectLevel.H
    });

    let checkCounter = 0;
    const interval = setInterval(() => {
      const qrElement = tempDiv.querySelector('canvas') || tempDiv.querySelector('img');
      checkCounter++;

      if (qrElement || checkCounter > 20) {
        clearInterval(interval);
        if (!qrElement) {
          alert("Nagka-error sa pag-render ng QR.");
          return;
        }

        renderHDCanvasCard(qrElement, storeName, phone);
      }
    }, 50);
  }

  function renderHDCanvasCard(qrSource, storeName, phone) {
    const canvas = document.getElementById('qrCanvas');
    const ctx = canvas.getContext('2d');
    const downloadBtn = document.getElementById('downloadBtn');

    // 3x High-Resolution Canvas Dimensions (1020 x 1380)
    const scale = 3;
    canvas.width = 340 * scale;
    canvas.height = 460 * scale;

    // Enable High-Quality Image Smoothing
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    // White Background
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Blue Header
    ctx.fillStyle = "#0275d8";
    ctx.fillRect(0, 0, canvas.width, 60 * scale);

    // Header Title
    ctx.fillStyle = "#ffffff";
    ctx.font = `bold ${18 * scale}px Arial`;
    ctx.textAlign = "center";
    ctx.fillText("📍 SHAREMAP DIGITAL ADDRESS", canvas.width / 2, 38 * scale);

    // Draw High-Res QR Code (720x720)
    const qrSize = 240 * scale;
    const qrX = (canvas.width - qrSize) / 2;
    const qrY = 80 * scale;
    ctx.drawImage(qrSource, qrX, qrY, qrSize, qrSize);

    // Draw Center Logo overlay
    if (uploadedLogo) {
      const logoSize = 50 * scale;
      const logoX = (canvas.width - logoSize) / 2;
      const logoY = qrY + (qrSize - logoSize) / 2;

      // Solid white box behind logo
      ctx.fillStyle = "#ffffff";
      const padding = 4 * scale;
      ctx.fillRect(logoX - padding, logoY - padding, logoSize + (padding * 2), logoSize + (padding * 2));

      // Draw logo
      ctx.drawImage(uploadedLogo, logoX, logoY, logoSize, logoSize);
    }

    // Divider Line
    ctx.strokeStyle = "#e0e0e0";
    ctx.lineWidth = 1 * scale;
    ctx.beginPath();
    ctx.moveTo(30 * scale, 340 * scale);
    ctx.lineTo(canvas.width - (30 * scale), 340 * scale);
    ctx.stroke();

    // Store Name
    ctx.fillStyle = "#222222";
    ctx.font = `bold ${18 * scale}px Arial`;
    ctx.fillText(storeName || "SHAREMAP MERCHANT", canvas.width / 2, 375 * scale);

    // Phone Number
    ctx.fillStyle = "#555555";
    ctx.font = `${14 * scale}px Arial`;
    ctx.fillText(`📱 ${phone}`, canvas.width / 2, 400 * scale);

    // Subtitle Instructions
    ctx.fillStyle = "#888888";
    ctx.font = `italic ${11 * scale}px Arial`;
    ctx.fillText("I-scan para mag-send ng Exact Location via SMS", canvas.width / 2, 435 * scale);

    // Show Download Button
    downloadBtn.style.display = "block";
  }

  function downloadQR() {
    const canvas = document.getElementById('qrCanvas');
    const storeName = document.getElementById('storeName').value.trim() || 'ShareMap';
    const link = document.createElement('a');
    
    const fileName = storeName.toLowerCase().replace(/[^a-z0-9]/g, '_');
    link.download = `sharemap_hd_qr_${fileName}.png`;
    link.href = canvas.toDataURL('image/png', 1.0);
    link.click();
  }
</script>

</body>
</html>
